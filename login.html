<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — EProfile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-eprofile">
  <div class="container">
    <a class="navbar-brand" href="index.html">EProfile</a>
  </div>
</nav>

<main class="container py-5" style="max-width: 420px;">
  <h1 class="h4 mb-4">Iniciar sesión</h1>

  <form id="form-login" class="tarjeta-simple p-4" novalidate>
    <div class="mb-3">
      <label class="form-label">Correo</label>
      <input type="email" class="form-control" id="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="password" required>
    </div>
    <div id="error-login" class="alert alert-danger py-2 small d-none"></div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  <div class="mt-4 small text-muted">
    <p class="mb-1"><strong>Cuentas de demostración:</strong></p>
    <p class="mb-1">Administrador: admin@eprofile.local / Admin123!</p>
    <p class="mb-1">Isabella López: isabella.lopez@iest.edu.mx / Isabella123!</p>
    <p class="mb-0">Lorena Vargas: lorena.vargas@iest.edu.mx / Lorena123!</p>
  </div>
</main>

<script src="js/datos.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById('form-login').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const resultado = iniciarSesion(email, password);
    const cajaError = document.getElementById('error-login');
    if (!resultado.ok) {
      cajaError.textContent = resultado.mensaje;
      cajaError.classList.remove('d-none');
      return;
    }
    if (resultado.sesion.rol === 'admin') {
      window.location.href = 'admin.html';
    } else {
      const db = leerDB();
      const est = db.estudiantes.find((e) => e.id === resultado.sesion.estudianteId);
      window.location.href = 'panel.html?slug=' + encodeURIComponent(est.slug);
    }
  });

  // Si ya hay sesión activa, evita mostrar el login de nuevo
  const sesion = sesionActual();
  if (sesion) {
    if (sesion.rol === 'admin') window.location.href = 'admin.html';
    else {
      const db = leerDB();
      const est = db.estudiantes.find((e) => e.id === sesion.estudianteId);
      if (est) window.location.href = 'panel.html?slug=' + encodeURIComponent(est.slug);
    }
  }
</script>
</body>
</html>
