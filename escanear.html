<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escanear QR — EProfile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-eprofile">
  <div class="container">
    <a class="navbar-brand" href="index.html">EProfile</a>
  </div>
</nav>

<main class="container py-5" style="max-width: 480px;">
  <h1 class="h4 mb-3">Escanear código QR</h1>

  <div id="aviso-soporte" class="alert alert-secondary d-none small"></div>

  <button id="btn-activar-camara" class="btn btn-primary mb-3">Activar cámara</button>
  <video id="video-camara" class="w-100 rounded mb-3 d-none" muted playsinline></video>

  <hr>

  <h2 class="h6">O ingresa el usuario manualmente</h2>
  <form id="form-manual" class="d-flex gap-2">
    <input type="text" id="entrada-manual" class="form-control" placeholder="isabella">
    <button type="submit" class="btn btn-outline-primary">Abrir EProfile</button>
  </form>

  <div id="resultado-escaneo" class="mt-3"></div>
</main>

<script src="js/escanear.js"></script>
<script>iniciarEscaneo();</script>
</body>
</html>
