<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del estudiante — EProfile</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<nav class="navbar navbar-eprofile">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="index.html">EProfile <span id="nombre-slug" class="text-muted fw-normal"></span></a>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" id="btn-cerrar-sesion">Cerrar sesión</button>
    </div>
  </div>
</nav>

<div class="alert alert-info rounded-0 mb-0 d-none text-center small" id="aviso-admin">
  Estás administrando este perfil como administrador.
</div>

<div class="d-flex">
  <aside class="sidebar-panel p-3" style="width: 220px;">
    <nav class="nav flex-column">
      <a class="nav-link active" data-tab="personal" href="#">Información personal</a>
      <a class="nav-link" data-tab="educacion" href="#">Formación</a>
      <a class="nav-link" data-tab="experiencia" href="#">Experiencia</a>
      <a class="nav-link" data-tab="proyectos" href="#">Proyectos</a>
      <a class="nav-link" data-tab="habilidades" href="#">Habilidades</a>
      <a class="nav-link" data-tab="reconocimientos" href="#">Reconocimientos</a>
    </nav>
  </aside>

  <main class="flex-fill p-4">
    <div id="panel-dashboard"></div>

    <div class="tarjeta-simple p-4">
      <div class="tab-contenido" id="tab-personal"><div id="seccion-personal"></div></div>
      <div class="tab-contenido d-none" id="tab-educacion"><div id="seccion-educacion"></div></div>
      <div class="tab-contenido d-none" id="tab-experiencia"><div id="seccion-experiencia"></div></div>
      <div class="tab-contenido d-none" id="tab-proyectos"><div id="seccion-proyectos"></div></div>
      <div class="tab-contenido d-none" id="tab-habilidades"><div id="seccion-habilidades"></div></div>
      <div class="tab-contenido d-none" id="tab-reconocimientos"><div id="seccion-reconocimientos"></div></div>
    </div>

    <div class="d-flex gap-2 mt-4">
      <button class="btn btn-outline-secondary" id="btn-guardar-borrador">Guardar borrador</button>
      <button class="btn btn-outline-primary" id="btn-previsualizar">Previsualizar</button>
      <button class="btn btn-primary" id="btn-publicar">Publicar EProfile</button>
    </div>
  </main>
</div>

<div id="contenedor-toasts"></div>

<script src="js/datos.js"></script>
<script src="js/auth.js"></script>
<script src="js/panel.js"></script>
<script>
  iniciarPanel();

  document.querySelectorAll('.sidebar-panel .nav-link').forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.sidebar-panel .nav-link').forEach((l) => l.classList.remove('active'));
      link.classList.add('active');
      document.querySelectorAll('.tab-contenido').forEach((t) => t.classList.add('d-none'));
      document.getElementById('tab-' + link.dataset.tab).classList.remove('d-none');
    });
  });
</script>
</body>
</html>
